<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLAMMABLEBUMP — Be Right Back</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .center {
      position: absolute; inset: 0;
      display: grid;
      place-items: center;
    }
    .center-inner {
      width: min(860px, 80vw);
      padding: 56px 72px;
      clip-path: var(--clip-xl);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* Pulsing inner glow */
    .center-inner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,140,0,0.08), transparent);
      animation: pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    .tag-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .big-title { font-size: 118px; }
    .subtitle  { margin-top: 22px; font-size: 30px; }

    .dots {
      display: inline-flex;
      gap: 8px;
      margin-left: 4px;
    }
    .dot-anim {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ice);
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot-anim:nth-child(2) { animation-delay: 0.2s; }
    .dot-anim:nth-child(3) { animation-delay: 0.4s; }

    /* Platform links row */
    .link-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 28px;
    }
    .link-pill {
      padding: 10px 22px;
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      clip-path: var(--clip-sm);
    }
    .link-pill.twitch   { border: 1px solid rgba(145,71,255,0.5); background: rgba(145,71,255,0.12); color: #bf9fff; }
    .link-pill.kick     { border: 1px solid rgba(83,252,73,0.4);  background: rgba(83,252,73,0.1);  color: #7fff78; }
    .link-pill.youtube  { border: 1px solid rgba(255,140,0,0.4);  background: rgba(255,140,0,0.10); color: var(--white); }

    @keyframes dotPulse {
      0%,80%,100% { opacity: 0.3; transform: scale(0.7); }
      40%          { opacity: 1;   transform: scale(1); }
    }
  </style>
</head>
<body data-game-always-rotate>
<main class="scene">
  <div class="bg"></div>
  <div class="grid-layer"></div>
  <div class="scanline-layer"></div>
  <div class="sweep-line"></div>
  <section class="center">
    <div class="center-inner glass anim-in">
      <div class="tag-row">
        <div class="tag">Hold position</div>
        <div class="dots">
          <div class="dot-anim"></div>
          <div class="dot-anim"></div>
          <div class="dot-anim"></div>
        </div>
      </div>
      <h1 class="big-title">Be Right<br>Back</h1>
      <p class="subtitle anim-in-2">
        <span data-display-name>FLAMMABLEBUMP</span> is reloading
      </p>
      <div class="link-row anim-in-3">
        <div class="link-pill twitch"  data-twitch>twitch.tv/FlammableBump</div>
        <div class="link-pill kick"    data-kick>kick.com/FlammableBump</div>
        <div class="link-pill youtube" data-youtube>youtube.com/@flammablebump</div>
      </div>
    </div>
  </section>

  <div class="ticker">
    <span><strong>Twitch</strong> <span data-twitch>twitch.tv/FlammableBump</span></span>
    <span class="dot">◆</span>
    <span><strong>Kick</strong> <span data-kick>kick.com/FlammableBump</span></span>
    <span class="dot">◆</span>
    <span><strong>YouTube</strong> <span data-youtube>youtube.com/@flammablebump</span></span>
    <span class="dot">◆</span>
    <span><strong>Game</strong> <span data-game>League of Legends</span></span>
  </div>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/overlay.js"></script>
</body>
</html>
