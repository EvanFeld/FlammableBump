<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLAMMABLEBUMP — Chatbox</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    body { width: 500px; height: 780px; }

    .chat-widget {
      width: 500px;
      height: 780px;
      clip-path: var(--clip-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .chatbox-header {
      flex-shrink: 0;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,140,0,0.08), transparent);
    }
    .chatbox-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .chatbox-title {
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
    }
    .chatbox-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ash);
      opacity: 0.75;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #6fdc88;
      animation: pulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    .platform-pills {
      display: flex;
      gap: 6px;
    }

    /* ── FEED ── */
    .chat-feed {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 5px;
      padding: 10px 10px 10px;
      overflow: hidden;
    }

    /* ── COMMAND RESPONSE ZONE ── */
    .cmd-zone {
      flex-shrink: 0;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      min-height: 36px;
      display: flex;
      align-items: center;
      background: rgba(5,3,0,0.5);
    }

    /* Tighter message layout for chatbox */
    .chat-message {
      padding: 7px 9px;
    }
    .chat-avatar { width: 26px; height: 26px; font-size: 10px; }
    .chat-name   { font-size: 14px; }
    .chat-text   { font-size: 16px; }
  </style>
</head>
<body>
<main class="chat-widget glass">
  <header class="chatbox-header">
    <div class="chatbox-top">
      <div class="chatbox-title">Live Chat</div>
      <div class="chatbox-status">
        <div class="status-dot"></div>
        <span data-chat-status>Connecting…</span>
      </div>
    </div>
    <div class="platform-pills">
      <div class="tag twitch">Twitch</div>
      <div class="tag kick">Kick</div>
    </div>
  </header>

  <div class="chat-feed" data-chat-feed></div>

  <div class="cmd-zone">
    <span data-cmd-response></span>
  </div>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/chat.js"></script>
<script src="../assets/interactions.js"></script>
<script src="../assets/streamerbot.js"></script>
</body>
</html>
