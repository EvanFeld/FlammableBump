<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLAMMABLEBUMP — Viewer List</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    body { width: 320px; height: 600px; overflow: hidden; }

    .vl-panel {
      display: flex;
      flex-direction: column;
      width: 320px;
      height: 600px;
      padding: 16px 14px;
      clip-path: var(--clip-xl);
      gap: 0;
    }

    .vl-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .vl-header .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #6fdc88;
      animation: pulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    .vl-title {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tan);
    }
    .vl-count {
      margin-left: auto;
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
      color: var(--blue-bright);
      line-height: 1;
    }

    .vl-divider { height: 1px; background: var(--border); margin-bottom: 12px; flex-shrink: 0; }

    .vl-scroll {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Fade mask top/bottom */
    .vl-scroll::before,
    .vl-scroll::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 28px;
      pointer-events: none;
      z-index: 2;
    }
    .vl-scroll::before { top: 0;    background: linear-gradient(to bottom, rgba(5,14,23,0.9), transparent); }
    .vl-scroll::after  { bottom: 0; background: linear-gradient(to top,    rgba(5,14,23,0.9), transparent); }

    .vl-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: vl-scroll-anim var(--scroll-dur, 30s) linear infinite;
      will-change: transform;
    }
    .vl-list:hover { animation-play-state: paused; }

    @keyframes vl-scroll-anim {
      0%   { transform: translateY(0); }
      100% { transform: translateY(var(--scroll-dist, -50%)); }
    }

    .vl-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 8px;
      border-radius: 2px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .vl-row:hover { background: rgba(74,144,217,0.1); }

    .vl-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(74,144,217,0.4), rgba(5,14,23,0.8));
      border: 1px solid rgba(184,216,240,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 700;
      color: var(--ice);
      flex-shrink: 0;
    }
    .vl-avatar.mod   { border-color: rgba(111,220,136,0.5); background: linear-gradient(135deg, rgba(80,180,100,0.3), rgba(5,14,23,0.8)); }
    .vl-avatar.sub   { border-color: rgba(74,144,217,0.6);  background: linear-gradient(135deg, rgba(74,144,217,0.3), rgba(5,14,23,0.8)); }
    .vl-avatar.vip   { border-color: rgba(212,169,122,0.5); background: linear-gradient(135deg, rgba(212,169,122,0.28), rgba(5,14,23,0.8)); }

    .vl-name {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .vl-badge {
      font-family: var(--font-head);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      padding: 2px 5px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .vl-badge.mod  { background: rgba(111,220,136,0.2); color: #6fdc88; border: 1px solid rgba(111,220,136,0.3); }
    .vl-badge.sub  { background: rgba(74,144,217,0.2);  color: #6db3f2; border: 1px solid rgba(74,144,217,0.3); }
    .vl-badge.vip  { background: rgba(212,169,122,0.2); color: #d4a97a; border: 1px solid rgba(212,169,122,0.3); }

    .vl-empty {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ice);
      opacity: 0.4;
      text-align: center;
      padding: 32px 0;
    }

    /* New-viewer pop-in */
    .vl-row.new-in {
      animation: rowIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes rowIn {
      from { opacity:0; transform: translateX(-12px); }
      to   { opacity:1; transform: translateX(0); }
    }
  </style>
</head>
<body>
<main class="vl-panel glass">
  <div class="vl-header">
    <span class="live-dot"></span>
    <span class="vl-title">In Chat</span>
    <span class="vl-count" id="vlCount">0</span>
  </div>
  <div class="vl-divider"></div>
  <div class="vl-scroll">
    <div class="vl-list" id="vlList">
      <div class="vl-empty" id="vlEmpty">Waiting for viewers…</div>
    </div>
  </div>
</main>

<!-- hidden stat triggers hasStats=true so streamerbot.js subscribes to PresentViewers -->
<span data-stat="twitchViewers" style="display:none" aria-hidden="true"></span>
<script src="../assets/config.js"></script>
<script src="../assets/streamerbot.js"></script>
<script>
(function () {
  const list   = document.getElementById("vlList");
  const count  = document.getElementById("vlCount");
  const empty  = document.getElementById("vlEmpty");
  const SCROLL_PX_PER_SEC = 28; // scroll speed

  let viewers = [];   // [{name, role}]
  let knownNames = new Set();

  function roleOf(v) {
    if (v.isModerator || v.role === "moderator" || v.mod) return "mod";
    if (v.isSubscriber || v.role === "subscriber" || v.sub) return "sub";
    if (v.isVip || v.role === "vip" || v.vip) return "vip";
    return "";
  }

  function render(incoming, isUpdate) {
    viewers = incoming;
    count.textContent = viewers.length;

    if (!viewers.length) {
      list.innerHTML = "";
      list.appendChild(empty);
      list.style.animation = "none";
      return;
    }
    empty.remove();

    if (isUpdate) {
      // Incremental: add only new names, keep existing rows
      viewers.forEach(v => {
        const name = v.displayName || v.userName || v.name || v;
        if (typeof name !== "string" || !name || knownNames.has(name.toLowerCase())) return;
        knownNames.add(name.toLowerCase());
        const row = makeRow(name, roleOf(v));
        row.classList.add("new-in");
        list.appendChild(row);
      });
    } else {
      // Full replace
      list.innerHTML = "";
      delete list.dataset.duped;
      knownNames.clear();
      viewers.forEach(v => {
        const name = v.displayName || v.userName || v.name || v;
        if (typeof name !== "string" || !name) return;
        knownNames.add(name.toLowerCase());
        list.appendChild(makeRow(name, roleOf(v)));
      });
    }

    updateScroll();
  }

  function makeRow(name, role) {
    const row = document.createElement("div");
    row.className = "vl-row";
    const av   = document.createElement("div");
    av.className = "vl-avatar" + (role ? " " + role : "");
    av.textContent = name.slice(0, 2).toUpperCase();
    const nm   = document.createElement("div");
    nm.className = "vl-name";
    nm.textContent = name;
    row.appendChild(av);
    row.appendChild(nm);
    if (role) {
      const bd = document.createElement("span");
      bd.className = "vl-badge " + role;
      bd.textContent = role.toUpperCase();
      row.appendChild(bd);
    }
    return row;
  }

  function updateScroll() {
    const rows   = list.querySelectorAll(".vl-row");
    const total  = rows.length;
    if (!total) return;

    const rowH   = 37; // approx row height + gap
    const visible = Math.floor(list.parentElement.clientHeight / rowH);

    if (total <= visible) {
      list.style.animation = "none";
      list.style.transform = "translateY(0)";
      return;
    }

    // Duplicate list for seamless loop
    if (!list.dataset.duped) {
      list.dataset.duped = "1";
      [...rows].forEach(r => list.appendChild(r.cloneNode(true)));
    }

    const halfH  = (total * rowH);
    const dur    = Math.max(10, halfH / SCROLL_PX_PER_SEC);
    list.style.setProperty("--scroll-dist", `-${halfH}px`);
    list.style.setProperty("--scroll-dur",  `${dur}s`);
    list.style.animation = `vl-scroll-anim ${dur}s linear infinite`;
  }

  // Listen for PresentViewers event dispatched by streamerbot.js
  window.addEventListener("flammablebump:viewers", e => {
    const { viewers: raw } = e.detail || {};
    if (Array.isArray(raw)) render(raw, false);
  });

  // Also pick up chat messages to add new chatters to the list
  window.addEventListener("flammablebump:connected", () => {
    // Request a fresh viewer list via SB WebSocket if available
    setTimeout(() => {
      if (window.FlammableBumpStreamerBot?.send) {
        window.FlammableBumpStreamerBot.send({ request: "GetActiveViewers", id: "vl-init" });
      }
    }, 1200);
  });
})();
</script>
</body>
</html>
