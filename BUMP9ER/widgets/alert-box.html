<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLAMMABLEBUMP — Alert Box</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    body { width: 960px; height: 240px; }

    .alert-stage {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }

    .alert-card {
      width: 900px;
      padding: 28px 36px;
      background: linear-gradient(135deg,
        rgba(255,140,0,0.18) 0%,
        rgba(6,3,0,0.94) 60%,
        rgba(12,6,2,0.92) 100%);
      border: 1px solid rgba(255,171,64,0.4);
      clip-path: var(--clip-lg);
      position: relative;
      overflow: hidden;
    }

    /* Animated top shimmer — color driven by --alert-color */
    .alert-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0.8;
      animation: alertShine 1.8s ease-in-out infinite;
    }

    /* Bottom glow */
    .alert-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to top, var(--alert-glow, rgba(255,140,0,0.15)), transparent);
      pointer-events: none;
    }

    .alert-icon {
      font-size: 84px;
      width: 120px;
    }

    .alert-body {
      min-width: 0;
    }

    .alert-type   { margin-bottom: 2px; }
    .alert-user   { margin: 0; }
    .alert-detail { margin-top: 8px; }
  </style>
</head>
<body>
<main class="alert-stage" data-alert-root>
  <div class="alert-card">
    <div class="alert-icon" data-alert-icon>★</div>
    <div class="alert-body">
      <div class="alert-type"   data-alert-type>New Subscriber</div>
      <div class="alert-user"   data-alert-user>BUMP9ER</div>
      <div class="alert-detail" data-alert-detail>Tier 1 sub secured</div>
    </div>
  </div>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/alerts.js"></script>
<script src="../assets/streamerbot.js"></script>
</body>
</html>
