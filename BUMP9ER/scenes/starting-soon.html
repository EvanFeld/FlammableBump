<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLAMMABLEBUMP — Starting Soon</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    /* ── MAIN CONTENT ── */
    .content {
      position: absolute;
      top: 50%;
      left: 8%;
      transform: translateY(-52%);
      max-width: 980px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .big-title { font-size: 130px; }
    .subtitle  { margin-top: 22px; font-size: 34px; }

    .live-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #6fdc88;
      animation: pulse 1.6s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(111,220,136,0.6);
      flex-shrink: 0;
    }

    /* ── INFO PANEL — right side ── */
    .info-panel {
      position: absolute;
      top: 100px;
      right: 80px;
      width: 440px;
      padding: 28px;
      clip-path: var(--clip-lg);
    }
    .info-panel-title {
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--tan);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-warm);
      padding-bottom: 10px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-key {
      color: var(--tan);
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .info-val {
      color: var(--ice);
      font-family: var(--font-head);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: right;
    }

    /* ── STATS PANEL — bottom right ── */
    .stats-panel {
      position: absolute;
      right: 80px;
      bottom: 110px;
    }
    .stats-panel .stat-card { min-width: 190px; height: 82px; }
    .stats-panel .stat-value { font-size: 42px; }
    .stats-panel .stat-label { font-size: 12px; }

    /* ── GOAL BAR — bottom left ── */
    .goal-bottom {
      position: absolute;
      bottom: 110px;
      left: 8%;
      width: 520px;
      padding: 16px 22px;
      clip-path: var(--clip-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .goal-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .goal-row .bar-label { width: 76px; flex-shrink: 0; font-size: 10px; }
    .goal-row .progress-track { flex: 1; height: 9px; }
    .goal-row .bar-value { width: 72px; text-align: right; font-size: 12px; color: var(--blue-bright); flex-shrink: 0; }
  </style>
</head>
<body>
<main class="scene">
  <div class="bg"></div>
  <div class="grid-layer"></div>
  <div class="scanline-layer"></div>
  <div class="sweep-line"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="frame-h top"></div>
  <div class="frame-h bottom"></div>
  <div class="frame-v left"></div>
  <div class="frame-v right"></div>

  <!-- Main title -->
  <section class="content">
    <div class="eyebrow anim-in">
      <div class="live-dot"></div>
      <div class="tag">Stream booting</div>
      <div class="tag twitch">Twitch</div>
      <div class="tag kick">Kick</div>
    </div>
    <h1 class="big-title anim-in-2">Starting<br>Soon</h1>
    <p class="subtitle anim-in-3">
      <span data-display-name>FLAMMABLEBUMP</span>
      <span class="slash"></span>
      <span data-game>League of Legends</span>
    </p>
  </section>

  <!-- Info panel -->
  <section class="info-panel glass anim-in-2">
    <div class="info-panel-title">Stream Info</div>
    <div class="info-row">
      <span class="info-key">Twitch</span>
      <span class="info-val" data-twitch>twitch.tv/FlammableBump</span>
    </div>
    <div class="info-row">
      <span class="info-key">Kick</span>
      <span class="info-val" data-kick>kick.com/FlammableBump</span>
    </div>
    <div class="info-row">
      <span class="info-key">Game</span>
      <span class="info-val" data-game>League of Legends</span>
    </div>
    <div class="info-row">
      <span class="info-key">Mode</span>
      <span class="info-val">Ranked Energy</span>
    </div>
    <div class="info-row">
      <span class="info-key">Commands</span>
      <span class="info-val" style="font-size:14px">!hype !gg !squad</span>
    </div>
  </section>

  <!-- Stats -->
  <section class="stats-panel stat-row anim-in-4" aria-label="Live counters">
    <div class="stat-card glass">
      <div class="stat-label">Followers</div>
      <div class="stat-value" data-stat="followers">0</div>
    </div>
    <div class="stat-card glass">
      <div class="stat-label">Subs</div>
      <div class="stat-value" data-stat="subs">0</div>
    </div>
    <div class="stat-card glass combined-card">
      <div class="stat-label">Viewers</div>
      <div class="stat-value" data-stat="viewers">0</div>
    </div>
  </section>

  <!-- Goal bar -->
  <div class="goal-bottom glass anim-in-4">
    <div class="goal-row">
      <span class="bar-label label" data-goal-label>Sub Goal</span>
      <div class="progress-track">
        <div class="progress-fill goal-fill" data-goal-fill style="width:0%"></div>
      </div>
      <span class="bar-value" data-goal-value>0 / 10</span>
    </div>
  </div>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/overlay.js"></script>
<script src="../assets/interactions.js"></script>
<script src="../assets/streamerbot.js"></script>
</body>
</html>
